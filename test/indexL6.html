<!DOCTYPE html>

<head>
    <title>
        Layout 1
    </title>

    <style>
        body{
            box-sizing: border-box;
            height: 100vh;
            margin: 0px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h3{
            margin: 0px;
        }
        .navCont{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px dotted black;
        }
        .navMidMenu{
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        .footerCont{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border-top: 1px dotted grey;
            padding-top: 4px;
        }
        .heroCont{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 100px;
        }
        .linkCont{
            display: flex;
            flex-direction: row;
            gap: 40px;
        }
        .featureCont,.testCont,.prodImgCont{
            display: flex;
            flex-direction: row;
            justify-content: space-around ;
        }
    </style>
</head>

<body>
    <div class="navCont">
        <div class="navLogo">
            <h3>
                Logo
            </h3>
        </div>

        <div class="navMidMenu">
            <span>
                Store
            </span>
            <span>
                Mac
            </span>
            <span>
                Iphone
            </span>
            <span>
                Support
            </span>
        </div>

        <div class="navProfileButton">
            <span>
                Profile
            </span>
        </div>
    </div>

    <div class="heroCont">
        <span>
            Iphone Infinity
        </span>
        <span>
            The Future Starts Today.
        </span>
        <div class="linkCont">
            <span>
                [Buy]
            </span>
            <span>
                [Learn More]
            </span>
        </div>
    </div>

    <div class="prodImgCont">
        <h4>
            Image of Product (large and centred)
        </h4>
    </div>

    <div class="featureCont">
        <span>
            Feature 1
        </span>
        <span>
            Feature 2
        </span>
        <span>
            Feature 3
        </span>
    </div>

    <div class="testCont">
        <h4>
            Testimonials
        </h4>
    </div>

    <div class="footerCont">
         <span>
             Copyright 
         </span>
         <span>
             gmail: asb@gmail.com
         </span>
         <span>
             END
         </span>
    </div>
</body>
