<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>
            webOCR
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
        <style>
            :root{
                --logoSize : 100px;
                --statusBoxPadding : 25px;
            }
            h1,img,h3{
                margin: 0;
            }
            .logo{
                display: flex;
                flex-direction: column;
                gap: 2px;
                align-items: center;

                /*font*/
                font-family: "Inter", sans-serif;
                font-optical-sizing: auto;
                
            }
            .logo>img{
                height: var(--logoSize);
                width: var(--logoSize);
            }
            .logo>span{
                color: #596579;
                font-size: 1em;
            }
            .logo>h1{
                color: #111827;
                font-size: 2em;
            }
            .button_div{
                display: flex;
                flex-direction: row;
                justify-content: center;
                margin-top: 30px;
            }
            .button_div>button{
                background-color: #246BFD;
                border: 0;
                width: 300px;
                height: 80px;
                border-radius: 20px;
                color: white;
                /*font*/
                font-family: "Inter", sans-serif;
                font-optical-sizing: auto;
                font-size: 1.5em;
                font-weight: 500;
                word-spacing: 0.7em;
                box-shadow: 0 8px 20px rgba(36, 107, 253, 0.25);

                cursor: pointer;
            }

            .currentStatus{
                border: 1px solid #CDD3E0;
                margin-top: 20px;
                width: 600px;
                height: 300px;
                margin-left: auto;
                margin-right: auto;
                border-radius: 10px;
            }
            .statusNav{
                background-color: #EEF1FF;
                border-top-left-radius: 10px;
                border-top-right-radius: 10px;
                height: 50px;

                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 0px var(--statusBoxPadding);
                font-family: "inter", sans-serif;
                font-size: 1.0em;
            }
            .bubble{
                height: 10px;
                width: 10px;
                border-radius:50% ;
            }
            .green{
                background-color: #43D477;
            }
            .infoCard{
                font-family: "JetBrains Mono", monospace;
                display: flex;
                flex-direction: row;
                gap: 20px;
            }
            .f_yellow{
                color: #F4B400;
            }
            .f_red{
                color: #E53935;
            }
            .status_info{
                margin-top: 20px;
                display: flex;
                flex-direction: column;
                gap: 15px;
                padding: 0px var(--statusBoxPadding);
            }
            .title{
                color: #667085;
                width: 200px;
            }
            .footCard>img{
                height: 40px;
                width: 40px;
            }
            .footer{
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap: 50px;
                margin: 50px 0px;

            }
            .footCard{
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 15px;
                border: 1px solid #CDD3E0;
                width: 200px;
                height: 50px;
                border-radius: 10px;
            }
            .footCard>h3{
                font-family: "inter", sans-serif;
                font-weight: 500;
            }
            .footer>a{
                color: black;
                text-decoration: none;
            }
            
        </style>
    </head>

    <body>
        <div class="logo">
            <img src="./res/ocr_logo.svg" alt="logo svg" />
            <h1>webOCR</h1>
            <span> a web app</span>
            
        </div>

        <div class="button_div">
            <button>
                ▶ Start
            </button>
        </div>

        <div class="currentStatus">
            <div class="statusNav"> 
                <h3>
                    Current Status
                </h3>
                <div class="green bubble"></div>
            </div>

            <div class="status_info">
                <div class="infoCard">
                    <span class="title"> [backend connection]</span>
                    <span class="value f_yellow">NA</span>
                </div>
                <div class="infoCard">
                    <span class="title"> [current status]</span>
                    <span class="value"> Working on fixing status alignment </span>
                </div>
                <div class="infoCard">
                    <span class="title"> [ISSUES]</span>
                    <span class="value f_red"> 1. Status alignment <br> 2. html doc alignment (centering) </span>
                </div>
            </div>
        </div>

        <div class="footer">
            <a class="footCard" href="./about.html">
                <img src="./res/about.svg" alt="about svg"/>
                <h3> ABOUT </h3>
            <a/>

            <a class="footCard" href="https://github.com/monkey-0028/webOCR">
                <img src="./res/github.svg" alt="github svg"/>
                <h3> GITHUB </h3>
            <a/>
        </div>
    </body>
</html>
